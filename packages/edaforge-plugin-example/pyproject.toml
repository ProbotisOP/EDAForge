[project]
name = "edaforge-plugin-example"
version = "0.1.0.dev0"
description = "Example analyzer plugin for EDAForge; the seed of the plugin template repository."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = ["edaforge", "numpy>=2.2"]

# Plugins register through this entry point group. The core loads a plugin only when the
# distribution is listed in the run config's `plugins:` list (section 20).
[project.entry-points."edaforge.analyzers"]
mean_shift = "edaforge_plugin_example.mean_shift:MeanShiftAnalyzer"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edaforge_plugin_example"]
