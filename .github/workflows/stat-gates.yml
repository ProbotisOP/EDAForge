name: stat-gates

# Section 16.3: the build fails if any statistical gate fails. Phase 0 runs the null-control and
# recall gates on the example analyzer; Phases 3 and 5 extend this to every analyzer.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m "slow" --durations=10
