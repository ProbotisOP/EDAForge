name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not slow"
      - name: every in-text citation has a bibliography entry
        # The check reads the specification, which is not in every checkout.
        run: |
          if [ -f docs/archive/PROJECT_PROMPT.v1.md ]; then
            uv run edaforge-verify-refs coverage
          else
            echo "::notice::docs/archive/PROJECT_PROMPT.v1.md is not in this checkout; citation coverage skipped"
          fi
