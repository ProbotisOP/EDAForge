[project]
name = "edaforge-devtools"
version = "0.1.0.dev0"
description = "Developer tooling for EDAForge: license gate and reference verification. Not published."
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = ["packaging>=24.2"]

[project.scripts]
edaforge-license-gate = "edaforge_devtools.license_gate.cli:main"
edaforge-verify-refs = "edaforge_devtools.verify_refs.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edaforge_devtools"]
